  - code: CS 360
    title: Software Engineering
    credits: 3
    year: 3
    semester: 1
    kind: core
    slot: C
    prerequisites: [CS 220]
    topics: [requirements, design patterns, testing, version control, agile delivery]
    description: "Building software in teams: requirements, design, testing, and delivery on a semester project."
  - code: CS 370
    title: Theory of Computation
    aliases: [TOC]
    credits: 3
    year: 3
    semester: 2
    kind: core
    slot: A
    prerequisites: [CS 201]
    topics: [automata, regular languages, context-free grammars, Turing machines, decidability]
    description: "What can and cannot be computed, from finite automata to Turing machines."
  - code: CS 345
    title: Deep Learning
    aliases: [DL]
    credits: 4
    year: 3
    semester: 2
    kind: elective
    tracks: [AI and Machine Learning]
    slot: D
    prerequisites: [CS 340]
    topics: [neural networks, backpropagation, convolutional networks, sequence models, transformers]
    description: "Neural networks from backpropagation to convolutional networks and transformers, trained in PyTorch."
  - code: CS 380
    title: Natural Language Processing
    aliases: [NLP]
    credits: 4
    year: 3
    semester: 2
    kind: elective
    tracks: [AI and Machine Learning, Data Science]
    slot: D
    prerequisites: [CS 340]
    topics: [text processing, word embeddings, language models, retrieval-augmented generation, evaluation]
    description: "Language technology from text processing and embeddings to large language models and retrieval-augmented generation."
  - code: CS 375
    title: Cloud Computing
    credits: 3
    year: 3
    semester: 2
    kind: elective
    tracks: [Systems]
    slot: E
