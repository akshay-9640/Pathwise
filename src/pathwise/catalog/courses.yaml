# Pathwise demo catalog: a fictional B.Tech Computer Science and Engineering program.
# Not a real university's catalog. Each course runs in one semester of one year and
# meets in one timetable slot; two courses in the same slot and semester clash.

program: B.Tech Computer Science and Engineering
institution: Pathwise Institute of Technology (fictional)

courses:
  # Year 1
  - code: CS 101
    title: Programming in Python
    credits: 4
    year: 1
    semester: 1
    kind: core
    slot: A
    prerequisites: []
    topics: [variables and types, control flow, functions, lists and dictionaries, files, debugging]
    description: "First programming course. Students write, test, and debug small Python programs and learn to break problems into functions."
  - code: MA 101
    title: Engineering Mathematics I
    credits: 4
    year: 1
    semester: 1
    kind: core
    slot: B
    prerequisites: []
    topics: [limits, differentiation, integration, sequences and series, matrices]
    description: "Single-variable calculus and an introduction to matrices for engineering students."
  - code: PH 101
    title: Engineering Physics
    credits: 3
    year: 1
    semester: 1
    kind: core
    slot: C
    prerequisites: []
    topics: [mechanics, waves, optics, semiconductors]
    description: "Physics foundations for engineers, ending with the semiconductor physics behind modern electronics."
  - code: EN 101
    title: Technical Communication
    credits: 2
    year: 1
    semester: 1
    kind: core
    slot: D
    prerequisites: []
    topics: [technical writing, presentations, reports, documentation]
    description: "Writing clear reports and documentation and giving short technical presentations."
  - code: CS 102
    title: Data Structures
    aliases: [DSA]
    credits: 4
    year: 1
    semester: 2
    kind: core
    slot: A
    prerequisites: [CS 101]
    topics: [arrays, linked lists, stacks and queues, trees, hashing, graphs, complexity]
    description: "Core data structures, their costs, and how to choose between them, implemented in Python."
  - code: MA 102
    title: Engineering Mathematics II
    credits: 4
    year: 1
    semester: 2
    kind: core
    slot: B
    prerequisites: [MA 101]
    topics: [multivariable calculus, differential equations, linear algebra, eigenvalues]
    description: "Multivariable calculus, differential equations, and the linear algebra used later in machine learning."
  - code: EE 101
    title: Basic Electrical Engineering
    credits: 3
    year: 1
    semester: 2
    kind: core
    slot: C
    prerequisites: []
    topics: [circuits, Kirchhoff's laws, AC circuits, digital logic basics]
    description: "Circuit analysis and an introduction to digital logic, preparing for computer organization."

  # Year 2
  - code: CS 201
    title: Discrete Mathematics
    credits: 3
    year: 2
    semester: 1
    kind: core
    slot: A
    prerequisites: [MA 101]
    topics: [logic, proofs, sets, relations, combinatorics, graph theory]
    description: "The mathematics of computer science: logic, proof techniques, counting, and graphs."
  - code: CS 220
    title: Database Systems
    aliases: [DBMS]
    credits: 4
    year: 2
    semester: 1
    kind: core
    slot: B
    prerequisites: [CS 102]
    topics: [relational model, SQL, joins, normalization, transactions, indexing]
    description: "Designing relational databases and querying them with SQL, from normalization to transactions and indexes."
  - code: CS 230
    title: Computer Organization
    aliases: [COA]
    credits: 3
    year: 2
    semester: 1
    kind: core
    slot: C
    prerequisites: [EE 101]
    topics: [number systems, CPU datapath, assembly, memory hierarchy, caches]
    description: "How a computer executes programs, from instructions and the datapath to caches and memory."
  - code: CS 250
    title: Design and Analysis of Algorithms
    aliases: [DAA]
    credits: 4
    year: 2
    semester: 2
    kind: core
    slot: A
    prerequisites: [CS 102, CS 201]
    topics: [divide and conquer, greedy algorithms, dynamic programming, graph algorithms, NP-completeness]
    description: "Designing algorithms and proving their correctness and running time."
  - code: CS 260
    title: Operating Systems
    aliases: [OS]
    credits: 4
    year: 2
    semester: 2
    kind: core
    slot: B
    prerequisites: [CS 102, CS 230]
    topics: [processes and threads, scheduling, synchronization, memory management, file systems]
    description: "How operating systems share a machine between programs, with hands-on work on threads and memory."
  - code: CS 270
    title: Computer Networks
    aliases: [CN]
    credits: 3
    year: 2
    semester: 2
    kind: core
    slot: C
    prerequisites: [CS 230]
    topics: [layered models, TCP and UDP, routing, HTTP, network security basics]
    description: "How data moves across networks, from links and routing to TCP and the web."
  - code: MA 201
    title: Probability and Statistics
    credits: 3
    year: 2
    semester: 2
    kind: core
    slot: D
    prerequisites: [MA 102]
    topics: [probability, random variables, distributions, estimation, hypothesis testing, regression]
    description: "Probability and statistics for computing, the mathematical base for machine learning and data courses."

  # Year 3
  - code: CS 340
    title: Machine Learning
    aliases: [ML]
    credits: 4
    year: 3
    semester: 1
    kind: core
    slot: A
    prerequisites: [CS 250, MA 201]
