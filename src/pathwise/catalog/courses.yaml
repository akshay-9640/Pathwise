    description: "Foundations of machine learning, from linear models and evaluation to trees and nearest neighbors."
  - code: CS 350
    title: Compiler Design
    aliases: [compilers]
    credits: 3
    year: 3
    semester: 1
    kind: core
    slot: B
    prerequisites: [CS 250]
    topics: [lexical analysis, parsing, semantic analysis, code generation, optimization]
