    description: "Running software in the cloud with containers, managed services, and serverless functions."
  - code: CS 385
    title: Computer Security
    aliases: [cybersecurity]
    credits: 3
    year: 3
    semester: 2
    kind: elective
    tracks: [Systems]
    slot: F
    prerequisites: [CS 260, CS 270]
    topics: [threat modeling, cryptography basics, web security, authentication, secure coding]
    description: "How systems are attacked and defended, with labs on web security and authentication."

  # Year 4
  - code: CS 410
    title: Distributed Systems
    credits: 3
    year: 4
    semester: 1
    kind: elective
    tracks: [Systems]
    slot: A
    prerequisites: [CS 260, CS 270]
